<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GrimDeck — Demo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a84c;--gold-dark:#7a5c1e;
  --stone:#2a2218;--stone-light:#3d3020;
  --text:#d4c5a0;--text-dim:#7a6d55;
  --hud-h:48px;--panel-h:215px;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Georgia,serif;color:var(--text)}
#app{display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh}

/* dungeon view */
#dungeon-view{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
#dungeon-canvas{display:block;width:100%;height:100%}

/* enemy overlay */
#enemy-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:10px;pointer-events:none}
#enemy-info{background:rgba(0,0,0,.78);border:1px solid var(--gold-dark);border-radius:6px;
  padding:7px 14px;text-align:center;min-width:185px}
#enemy-name{font-size:15px;color:var(--gold);letter-spacing:1px;display:block;margin-bottom:5px}
#enemy-hp-bar{width:100%;height:6px;background:#1a0000;border-radius:3px;overflow:hidden;margin-bottom:3px}
#enemy-hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#7a0000,#cc2222);
  transition:width .3s;border-radius:3px}
#enemy-hp-text{font-size:11px;color:var(--text-dim)}
#enemy-intent{margin-top:5px;font-size:12px;color:#e08080;background:rgba(0,0,0,.6);
  padding:2px 10px;border-radius:4px}

/* HUD */
#hud{height:var(--hud-h);background:linear-gradient(180deg,#0a0805,#000);border-top:1px solid #2a2010;
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
#hud-hp{display:flex;align-items:center;gap:6px;flex:1}
#health-bar{width:80px;height:8px;background:#1a0000;border-radius:4px;overflow:hidden;border:1px solid #3a0000}
#health-fill{height:100%;width:80%;background:linear-gradient(90deg,#6b1212,#cc3333);
  transition:width .4s;border-radius:4px}
#health-text{font-size:11px;color:var(--text-dim);white-space:nowrap}
#hud-center{font-size:13px;color:var(--gold);letter-spacing:1px}
#hud-right{display:flex;gap:8px;align-items:center}
.hud-icon{font-size:12px;color:var(--text-dim)}

/* bottom panels */
.bottom-panel{height:var(--panel-h);background:#000;border-top:1px solid #1e1810;flex-shrink:0}

/* dpad */
#controls{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
#dpad{display:flex;flex-direction:column;align-items:center;gap:4px}
.dpad-row{display:flex;align-items:center;gap:4px}
.dpad-center{width:52px;height:52px}
.dpad-btn{width:52px;height:52px;background:var(--stone);border:1px solid var(--stone-light);
  border-radius:8px;color:var(--text);font-size:20px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;user-select:none;touch-action:none;
  transition:background .1s,transform .08s;-webkit-user-select:none}
.dpad-btn:active{background:var(--stone-light);transform:scale(.93)}
#explore-actions{display:flex;flex-direction:column;gap:8px}
.action-btn{width:52px;height:52px;background:var(--stone);border:1px solid var(--stone-light);
  border-radius:8px;font-size:20px;cursor:pointer;touch-action:none;transition:background .1s}
.action-btn:active{background:var(--stone-light)}

/* combat */
#combat-controls{display:flex;flex-direction:column;padding:6px 6px 6px;gap:5px}
#combat-stats{display:flex;gap:6px;justify-content:center;min-height:20px}
.stat-badge{font-size:11px;background:rgba(255,255,255,.08);padding:1px 8px;
  border-radius:4px;color:var(--gold);letter-spacing:.5px}
#hand{display:flex;gap:5px;justify-content:center;overflow-x:auto;padding:2px 2px 3px;flex:1}

/* cards — narrow for 7 per row */
.card{flex-shrink:0;width:50px;min-height:102px;background:#12100a;
  border:1px solid var(--gold-dark);border-radius:7px;padding:5px 4px;
  cursor:pointer;user-select:none;touch-action:none;display:flex;flex-direction:column;
  gap:3px;transition:transform .15s,box-shadow .15s;-webkit-user-select:none}
.card:active{transform:scale(.92) translateY(-5px);box-shadow:0 8px 20px rgba(0,0,0,.6)}
.card.attack{border-color:#7a1a1a;background:linear-gradient(160deg,#1e0a0a,#140606)}
.card.block {border-color:#1a3a7a;background:linear-gradient(160deg,#080e1e,#060a14)}
.card.power {border-color:#5a1a7a;background:linear-gradient(160deg,#140820,#0c0614)}
.card.skill {border-color:#1a6a2a;background:linear-gradient(160deg,#08140a,#060c07)}
.card.disabled{opacity:.38;cursor:not-allowed}
.card-cost{width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;align-self:flex-start;
  background:#1a1200;border:1px solid var(--gold-dark);color:var(--gold)}
.card.attack .card-cost{background:#2a0808;border-color:#8b1a1a;color:#e08080}
.card.block  .card-cost{background:#08142a;border-color:#1a4a9b;color:#80a8e0}
.card.power  .card-cost{background:#1a0828;border-color:#7a1a9b;color:#d080f0}
.card.skill  .card-cost{background:#081408;border-color:#1a8b2a;color:#80e090}
.card-name{font-size:9px;color:var(--text);font-weight:bold;text-align:center;line-height:1.2}
.card-value{font-size:21px;font-weight:bold;text-align:center;line-height:1}
.card.attack .card-value{color:#e05555}
.card.block  .card-value{color:#5588e0}
.card.power  .card-value{color:#c060e0}
.card.skill  .card-value{color:#60c070}
.card-desc{font-size:8px;color:var(--text-dim);text-align:center;line-height:1.3;margin-top:auto}

.end-turn-btn{width:100%;height:34px;background:linear-gradient(180deg,#2a1a08,#1a1005);
  border:1px solid var(--gold-dark);border-radius:6px;color:var(--gold);font-size:13px;
  letter-spacing:1px;cursor:pointer;font-family:Georgia,serif;touch-action:none;
  transition:background .1s;flex-shrink:0}
.end-turn-btn:active{background:linear-gradient(180deg,#3a2a10,#2a1a08)}

/* reward overlay */
#reward-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:24px}
#reward-title{font-size:22px;color:var(--gold);letter-spacing:2px}
#reward-sub{font-size:13px;color:var(--text-dim)}
#reward-cards{display:flex;gap:12px;justify-content:center}
#reward-cards .card{width:96px!important;min-height:138px!important}
#reward-cards .card-name{font-size:12px!important}
#reward-cards .card-value{font-size:26px!important}
#reward-cards .card-desc{font-size:10px!important}
#btn-skip-reward{padding:10px 32px;background:transparent;border:1px solid #444;
  border-radius:6px;color:var(--text-dim);font-size:13px;cursor:pointer;
  font-family:Georgia,serif;touch-action:none;transition:border-color .15s}
#btn-skip-reward:active{border-color:var(--gold);color:var(--gold)}

.hidden{display:none!important}
@keyframes flash-red{0%{background-color:rgba(200,0,0,.32)}100%{background-color:transparent}}
.damage-flash{animation:flash-red .35s ease-out}
</style>
</head>
<body>
<div id="app">
  <div id="dungeon-view">
    <canvas id="dungeon-canvas"></canvas>
    <div id="enemy-overlay" class="hidden">
      <div id="enemy-info">
        <span id="enemy-name">Skeleton</span>
        <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
        <span id="enemy-hp-text">30/30</span>
      </div>
      <div id="enemy-intent">⚔ Attacks for <span id="enemy-intent-val">8</span></div>
    </div>
  </div>

  <div id="hud">
    <div id="hud-hp">
      <div id="health-bar"><div id="health-fill"></div></div>
      <span id="health-text">80/100</span>
    </div>
    <div id="hud-center">Floor <span id="floor-num">1</span></div>
    <div id="hud-right">
      <span id="block-text" class="hud-icon">🛡 0</span>
      <span id="energy-text" class="hud-icon">⚡ 3</span>
    </div>
  </div>

  <div id="controls" class="bottom-panel">
    <div id="dpad">
      <div class="dpad-row"><button id="btn-forward" class="dpad-btn">▲</button></div>
      <div class="dpad-row">
        <button id="btn-left" class="dpad-btn">◀</button>
        <div class="dpad-center"></div>

      </div>
      <div class="dpad-row"><button id="btn-back" class="dpad-btn">▼</button></div>
    </div>
    <div id="explore-actions">
      <button id="btn-minimap" class="action-btn">🗺</button>
    </div>
  </div>

  <div id="combat-controls" class="bottom-panel hidden">
    <div id="combat-stats"></div>
    <div id="hand"></div>
    <button id="btn-end-turn" class="end-turn-btn">End Turn</button>

  <div id="reward-overlay" class="hidden">
    <div id="reward-title">⚔ Victory!</div>

    <div id="reward-cards"></div>
    <button id="btn-skip-reward">Skip reward</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ── Card pool ────────────────────────────────────────────────────────────────

const CARDS = [
  // Starter deck
  {id:'st1',name:'Strike',       cost:1,type:'attack',effect:'damage',    value:6,  starter:true, desc:'Deal 6 dmg'},
  {id:'st2',name:'Strike',       cost:1,type:'attack',effect:'damage',    value:6,  starter:true, desc:'Deal 6 dmg'},
  {id:'st3',name:'Strike',       cost:1,type:'attack',effect:'damage',    value:6,  starter:true, desc:'Deal 6 dmg'},
  {id:'st4',name:'Heavy Blow',   cost:2,type:'attack',effect:'damage',    value:14, starter:true, desc:'Deal 14 dmg'},
  {id:'st5',name:'Defend',       cost:1,type:'block', effect:'block',     value:5,  starter:true, desc:'Gain 5 block'},
  {id:'st6',name:'Defend',       cost:1,type:'block', effect:'block',     value:5,  starter:true, desc:'Gain 5 block'},
  {id:'st7',name:'Quick Step',   cost:0,type:'block', effect:'block',     value:3,  starter:true, desc:'Gain 3 block'},
  // Rewards — Attacks
  {id:'r01',name:'Twin Strike',  cost:1,type:'attack',effect:'damage',    value:5,  hits:2,        desc:'5 dmg twice'},
  {id:'r02',name:'Whirlwind',    cost:0,type:'attack',effect:'whirlwind', value:6,                 desc:'6 dmg × energy left'},
  {id:'r03',name:'Body Slam',    cost:1,type:'attack',effect:'bodyslam',  value:0,                 desc:'dmg = your Block'},
  {id:'r04',name:'Pommel Strike',cost:1,type:'attack',effect:'damage',    value:9,  draw:1,        desc:'9 dmg + draw 1'},
  {id:'r05',name:'Headbutt',     cost:1,type:'attack',effect:'damage',    value:9,                 desc:'Deal 9 dmg'},
  {id:'r06',name:'Cleave',       cost:1,type:'attack',effect:'damage',    value:8,                 desc:'Deal 8 dmg'},
  {id:'r07',name:'Thunderclap',  cost:1,type:'attack',effect:'damage',    value:11,                desc:'Deal 11 dmg'},
  {id:'r08',name:'Carnage',      cost:2,type:'attack',effect:'damage',    value:20, exhaust:true,  desc:'20 dmg. Exhaust'},
  // Rewards — Blocks
  {id:'r09',name:'Shrug It Off', cost:1,type:'block', effect:'block',     value:11, draw:1,        desc:'11 block + draw 1'},
  {id:'r10',name:'Impervious',   cost:2,type:'block', effect:'block',     value:30, exhaust:true,  desc:'30 block. Exhaust'},
  {id:'r11',name:'Entrench',     cost:2,type:'block', effect:'entrench',  value:0,                 desc:'Double your Block'},
  {id:'r12',name:'Iron Wave',    cost:1,type:'block', effect:'iron_wave', value:5,                 desc:'5 dmg and 5 block'},
  // Rewards — Powers
  {id:'r13',name:'Inflame',      cost:1,type:'power', effect:'strength',  value:2,                 desc:'+2 STR this combat'},
  {id:'r14',name:'Armaments',    cost:1,type:'power', effect:'dexterity', value:2,                 desc:'+2 DEX this combat'},
  {id:'r15',name:'Flex',         cost:0,type:'power', effect:'strength',  value:2,                 desc:'+2 STR this combat'},
  {id:'r16',name:'Spot Weakness',cost:1,type:'power', effect:'strength',  value:3, exhaust:true,   desc:'+3 STR. Exhaust'},
  // Rewards — Skills
  {id:'r17',name:'Bloodletting', cost:0,type:'skill', effect:'bloodletting',value:0,               desc:'−3 HP, gain 2 energy'},
  {id:'r18',name:'Battle Trance',cost:0,type:'skill', effect:'draw',      value:3,                 desc:'Draw 3 cards'},
  {id:'r19',name:'Seeing Red',   cost:1,type:'skill', effect:'energy',    value:2, exhaust:true,   desc:'+2 energy. Exhaust'},
  {id:'r20',name:'Second Wind',  cost:1,type:'skill', effect:'second_wind',value:5,                desc:'5 block per non-attack in hand'},
  {id:'r21',name:'Offering',     cost:0,type:'skill', effect:'offering',  value:0, exhaust:true,   desc:'−6 HP, gain 2 energy, draw 3'},
];

// ── Dungeon generator ────────────────────────────────────────────────────────

const ENEMY_NAMES=['Skeleton','Goblin','Wraith','Zombie','Cultist','Shade'];

class Dungeon{
  constructor(w=22,h=22){
    this.width=w;this.height=h;this.grid=null;this.rooms=[];this.startPos=null;this.enemies=[];
    this.generate();
  }
  rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  overlaps(a,b,p=0){return!(a.x+a.w+p<=b.x||b.x+b.w+p<=a.x||a.y+a.h+p<=b.y||b.y+b.h+p<=a.y)}
  carveRoom(r){for(let z=r.y;z<r.y+r.h;z++)for(let x=r.x;x<r.x+r.w;x++)this.grid[z][x]=0}
  connectRooms(a,b){
    let cx=a.x+Math.floor(a.w/2),cz=a.y+Math.floor(a.h/2);
    const tx=b.x+Math.floor(b.w/2),tz=b.y+Math.floor(b.h/2);
    while(cx!==tx){this.grid[cz][cx]=0;cx+=cx<tx?1:-1}
    while(cz!==tz){this.grid[cz][cx]=0;cz+=cz<tz?1:-1}
  }
  generate(){
    this.grid=Array.from({length:this.height},()=>new Array(this.width).fill(1));
    this.rooms=[];
    for(let att=0;att<100&&this.rooms.length<12;att++){
      const rw=this.rand(3,7),rh=this.rand(3,6),rx=this.rand(1,this.width-rw-1),ry=this.rand(1,this.height-rh-1);
      const c={x:rx,y:ry,w:rw,h:rh};
      if(this.rooms.every(r=>!this.overlaps(r,c,1))){
        this.carveRoom(c);
        if(this.rooms.length>0)this.connectRooms(this.rooms[this.rooms.length-1],c);
        this.rooms.push(c);
      }
    }
    const f=this.rooms[0];
    this.startPos={x:f.x+Math.floor(f.w/2),z:f.y+Math.floor(f.h/2)};
    this.enemies=this.rooms.slice(1).map(r=>{
      const hp=20+this.rand(0,25);
      return{x:r.x+Math.floor(r.w/2),z:r.y+Math.floor(r.h/2),
             hp,maxHp:hp,attack:5+this.rand(0,6),
             name:ENEMY_NAMES[this.rand(0,ENEMY_NAMES.length-1)],alive:true};
    });
  }
  isWall(x,z){return x<0||z<0||x>=this.width||z>=this.height||this.grid[z][x]===1}
  getEnemyAt(x,z){return this.enemies.find(e=>e.alive&&e.x===x&&e.z===z)}
}

// ── Renderer ─────────────────────────────────────────────────────────────────

const TILE=2,WALL_H=2.6,EYE_Y=1.15;
const DIR_ANGLE=[0,-Math.PI/2,Math.PI,Math.PI/2];

class Renderer{
  constructor(canvas){
    this.scene=new THREE.Scene();
    this.scene.background=new THREE.Color(0x000000);
    this.scene.fog=new THREE.Fog(0x000000,4,22);
    this.camera=new THREE.PerspectiveCamera(72,1,0.05,60);
    this.renderer=new THREE.WebGLRenderer({canvas,antialias:false});
    this.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    this._setupLights();
    this.dungeonGroup=new THREE.Group();
    this.enemyGroup=new THREE.Group();
    this.scene.add(this.dungeonGroup,this.enemyGroup);
    this.torchTime=0;
  }
  _setupLights(){
    this.scene.add(new THREE.AmbientLight(0x6a5840,1.0));
    this.torch=new THREE.PointLight(0xffaa55,5.5,14,2);
    this.camera.add(this.torch);
    this.scene.add(this.camera);
  }
  buildDungeon(grid){
    this.dungeonGroup.clear();
    const wMat=new THREE.MeshLambertMaterial({color:0x907060});
    const fMat=new THREE.MeshLambertMaterial({color:0x3c3028});
    const cMat=new THREE.MeshLambertMaterial({color:0x201e18});
    const wGeo=new THREE.BoxGeometry(TILE,WALL_H,TILE);
    const pGeo=new THREE.PlaneGeometry(TILE,TILE);
    for(let z=0;z<grid.length;z++){
      for(let x=0;x<grid[z].length;x++){
        const wx=x*TILE,wz=z*TILE;
        if(grid[z][x]===1){
          const w=new THREE.Mesh(wGeo,wMat);w.position.set(wx,WALL_H/2,wz);this.dungeonGroup.add(w);
        } else {
          const fl=new THREE.Mesh(pGeo,fMat);fl.rotation.x=-Math.PI/2;fl.position.set(wx,0,wz);this.dungeonGroup.add(fl);
          const cl=new THREE.Mesh(pGeo,cMat);cl.rotation.x=Math.PI/2;cl.position.set(wx,WALL_H,wz);this.dungeonGroup.add(cl);
        }
      }
    }
  }
  buildEnemyMarkers(enemies){
    this.enemyGroup.clear();
    const eGeo=new THREE.SphereGeometry(0.07,6,6);
    const eMat=new THREE.MeshBasicMaterial({color:0xff2200});
    enemies.forEach(enemy=>{
      const m=new THREE.Group();
      [-0.15,0.15].forEach(ox=>{const eye=new THREE.Mesh(eGeo,eMat);eye.position.set(ox,0,0);m.add(eye)});
      m.add(new THREE.PointLight(0xff1100,0.9,3,2));
      m.position.set(enemy.x*TILE,EYE_Y,enemy.z*TILE);
      m.userData.enemy=enemy;
      this.enemyGroup.add(m);
    });
  }
  updateEnemyMarkers(){this.enemyGroup.children.forEach(m=>m.visible=m.userData.enemy.alive)}
  setPlayer(x,z,dir){
    this.camera.position.set(x*TILE,EYE_Y,z*TILE);
    this.camera.rotation.set(0,DIR_ANGLE[dir],0);
  }
  resize(w,h){this.renderer.setSize(w,h);this.camera.aspect=w/h;this.camera.updateProjectionMatrix()}
  render(dt){
    this.torchTime+=dt;
    this.torch.intensity=5.2+Math.sin(this.torchTime*6.3)*.28+Math.sin(this.torchTime*11.7)*.14;
    this.renderer.render(this.scene,this.camera);
  }
}

// ── Player ───────────────────────────────────────────────────────────────────

class Player{
  constructor(x,z){
    this.x=x;this.z=z;this.dir=0;
    this.hp=80;this.maxHp=100;
    this.block=0;this.strength=0;this.dexterity=0;
    this.deck=CARDS.filter(c=>c.starter).map(c=>({...c}));
    this.hand=[];this.energy=3;this.maxEnergy=3;
  }
  forwardDelta(){return{dx:[0,1,0,-1][this.dir],dz:[-1,0,1,0][this.dir]}}
  turnLeft(){this.dir=(this.dir+3)%4}
  turnRight(){this.dir=(this.dir+1)%4}
  moveTo(x,z){this.x=x;this.z=z}
  startCombat(){this.strength=0;this.dexterity=0;this.drawHand()}
  drawHand(n=7){
    this.hand=[...this.deck].sort(()=>Math.random()-.5).slice(0,n);
    this.energy=this.maxEnergy;
    this.block=0;
  }
}

// ── Game ─────────────────────────────────────────────────────────────────────

class Game{
  constructor(){
    this.canvas=document.getElementById('dungeon-canvas');
    this.state='explore';this.currentEnemy=null;this.lastTime=0;this.floor=1;
    this._newFloor();
    this._setupInput();
    this._resize();
    requestAnimationFrame(()=>this._resize());
    window.addEventListener('resize',()=>this._resize());
    requestAnimationFrame(t=>this._loop(t));
  }

  _newFloor(){
    this.dungeon=new Dungeon();
    const{x,z}=this.dungeon.startPos;
    if(!this.renderer)this.renderer=new Renderer(this.canvas);
    if(!this.player){this.player=new Player(x,z);}
    else{this.player.moveTo(x,z);this.player.dir=0;}
    this.renderer.buildDungeon(this.dungeon.grid);
    this.renderer.buildEnemyMarkers(this.dungeon.enemies);
    this.renderer.setPlayer(this.player.x,this.player.z,this.player.dir);
    document.getElementById('floor-num').textContent=this.floor;
    this._updateHUD();
  }

  _resize(){
    const v=document.getElementById('dungeon-view');
    this.renderer.resize(v.clientWidth,v.clientHeight);
  }

  _loop(time){
    const dt=Math.min((time-this.lastTime)/1000,.1);
    this.lastTime=time;
    this.renderer.render(dt);
    requestAnimationFrame(t=>this._loop(t));
  }

  // ── Exploration ───────────────────────

  _move(fwd){
    if(this.state!=='explore')return;
    const{dx,dz}=this.player.forwardDelta();
    const nx=this.player.x+(fwd?dx:-dx),nz=this.player.z+(fwd?dz:-dz);
    if(this.dungeon.isWall(nx,nz))return;
    const enemy=this.dungeon.getEnemyAt(nx,nz);
    if(enemy&&fwd){this._startCombat(enemy);return;}
    this.player.moveTo(nx,nz);
    this.renderer.setPlayer(this.player.x,this.player.z,this.player.dir);
  }

  _turn(left){
    if(this.state!=='explore')return;
    left?this.player.turnLeft():this.player.turnRight();
    this.renderer.setPlayer(this.player.x,this.player.z,this.player.dir);
  }

  // ── Combat ────────────────────────────

  _startCombat(enemy){
    this.state='combat';this.currentEnemy=enemy;
    this.player.startCombat();
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('combat-controls').classList.remove('hidden');
    document.getElementById('enemy-overlay').classList.remove('hidden');
    document.getElementById('enemy-name').textContent=enemy.name;
    document.getElementById('enemy-intent-val').textContent=enemy.attack;
    this._updateCombatUI();this._updateHUD();
  }

  playCard(i){
    if(this.state!=='combat')return;
    const card=this.player.hand[i];
    if(!card||this.player.energy<card.cost)return;

    const p=this.player,e=this.currentEnemy;
    p.energy-=card.cost;
    p.hand.splice(i,1);

    switch(card.effect){
      case 'damage':{
        const hits=card.hits||1;
        const dmg=Math.max(0,card.value+p.strength);
        for(let h=0;h<hits;h++)e.hp=Math.max(0,e.hp-dmg);
        this._flash();
        break;
      }
      case 'block':
        p.block+=card.value+p.dexterity;
        break;
      case 'entrench':
        p.block=p.block*2;
        break;
      case 'bodyslam':
        e.hp=Math.max(0,e.hp-p.block);
        this._flash();
        break;
      case 'iron_wave':
        p.block+=card.value+p.dexterity;
        e.hp=Math.max(0,e.hp-card.value-p.strength);
        this._flash();
        break;
      case 'whirlwind':{
        const spent=p.energy;
        e.hp=Math.max(0,e.hp-card.value*spent);
        p.energy=0;
        this._flash();
        break;
      }
      case 'strength':
        p.strength+=card.value;
        break;
      case 'dexterity':
        p.dexterity+=card.value;
        break;
      case 'bloodletting':
        p.hp=Math.max(1,p.hp-3);
        p.energy+=2;
        break;
      case 'draw':{
        const drawn=[...p.deck].sort(()=>Math.random()-.5).slice(0,card.value);
        p.hand.push(...drawn);
        break;
      }
      case 'energy':
        p.energy+=card.value;
        break;
      case 'second_wind':{
        const nonAtk=p.hand.filter(c=>c.type!=='attack');
        p.block+=nonAtk.length*card.value;
        p.hand=p.hand.filter(c=>c.type==='attack');
        break;
      }
      case 'offering':
        p.hp=Math.max(1,p.hp-6);
        p.energy+=2;
        const drawn=[...p.deck].sort(()=>Math.random()-.5).slice(0,3);
        p.hand.push(...drawn);
        break;
    }

    // secondary draw
    if(card.draw){
      const extra=[...p.deck].sort(()=>Math.random()-.5).slice(0,card.draw);
      p.hand.push(...extra);
    }

    if(e.hp<=0){
      setTimeout(()=>this._victory(),350);
      this._updateCombatUI();this._updateHUD();
      return;
    }
    this._updateCombatUI();this._updateHUD();
  }

  _enemyTurn(){
    if(this.state!=='combat')return;
    const dmg=this.currentEnemy.attack;
    const abs=Math.min(this.player.block,dmg);
    this.player.block=Math.max(0,this.player.block-dmg);
    this.player.hp=Math.max(0,this.player.hp-(dmg-abs));
    this._updateHUD();
    this.player.drawHand();
    this._updateCombatUI();
  }

  // ── Victory / Reward ──────────────────

  _victory(){
    this.currentEnemy.alive=false;
    this.renderer.updateEnemyMarkers();
    document.getElementById('combat-controls').classList.add('hidden');
    document.getElementById('enemy-overlay').classList.add('hidden');
    this._showReward();
  }

  _showReward(){
    const pool=CARDS.filter(c=>!c.starter);
    const picks=pool.sort(()=>Math.random()-.5).slice(0,3);
    const el=document.getElementById('reward-cards');
    el.innerHTML='';
    picks.forEach(card=>{
      const div=document.createElement('div');
      div.className=`card ${card.type}`;
      const val=card.value>0?card.value:(card.hits?card.value+'×'+card.hits:'—');
      div.innerHTML=`
        <div class="card-cost">${card.cost}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">${card.value||'✦'}</div>
        <div class="card-desc">${card.desc}${card.exhaust?' <em>(Exhaust)</em>':''}</div>`;
      div.addEventListener('pointerdown',ev=>{ev.preventDefault();this._pickReward(card);});
      el.appendChild(div);
    });
    document.getElementById('reward-overlay').classList.remove('hidden');
  }

  _pickReward(card){
    this.player.deck.push({...card,id:card.id+'_'+Date.now()});
    this._returnToExplore();
  }

  _returnToExplore(){
    this.state='explore';this.currentEnemy=null;
    document.getElementById('reward-overlay').classList.add('hidden');
    document.getElementById('controls').classList.remove('hidden');
    this._updateHUD();
  }

  // ── UI ────────────────────────────────

  _updateHUD(){
    const p=this.player;
    document.getElementById('health-fill').style.width=(p.hp/p.maxHp*100)+'%';
    document.getElementById('health-text').textContent=`${p.hp}/${p.maxHp}`;
    document.getElementById('block-text').textContent=`🛡 ${p.block}`;
    document.getElementById('energy-text').textContent=`⚡ ${p.energy}`;
  }

  _updateCombatUI(){
    const p=this.player,e=this.currentEnemy;if(!e)return;
    document.getElementById('enemy-hp-fill').style.width=Math.max(0,e.hp/e.maxHp*100)+'%';
    document.getElementById('enemy-hp-text').textContent=`${e.hp}/${e.maxHp}`;
    document.getElementById('energy-text').textContent=`⚡ ${p.energy}`;
    document.getElementById('block-text').textContent=`🛡 ${p.block}`;

    // Stat badges
    const stats=document.getElementById('combat-stats');
    stats.innerHTML='';
    if(p.strength>0)stats.innerHTML+=`<span class="stat-badge">⚔ STR +${p.strength}</span>`;
    if(p.dexterity>0)stats.innerHTML+=`<span class="stat-badge">🛡 DEX +${p.dexterity}</span>`;

    // Hand
    const hand=document.getElementById('hand');
    hand.innerHTML='';
    p.hand.forEach((card,i)=>{
      const el=document.createElement('div');
      el.className=`card ${card.type}${p.energy<card.cost?' disabled':''}`;
      el.innerHTML=`
        <div class="card-cost">${card.cost}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">${card.value||'✦'}</div>
        <div class="card-desc">${card.desc}</div>`;
      el.addEventListener('pointerdown',ev=>{ev.preventDefault();this.playCard(i);});
      hand.appendChild(el);
    });
  }

  _flash(){
    const v=document.getElementById('dungeon-view');
    v.classList.remove('damage-flash');void v.offsetWidth;v.classList.add('damage-flash');
  }

  // ── Input ─────────────────────────────

  _setupInput(){
    const on=(id,fn)=>{
      const el=document.getElementById(id);if(!el)return;
      el.addEventListener('pointerdown',e=>{e.preventDefault();fn();});
    };
    on('btn-forward',()=>this._move(true));
    on('btn-back',   ()=>this._move(false));
    on('btn-left',   ()=>this._turn(true));
    on('btn-right',  ()=>this._turn(false));
    on('btn-end-turn',()=>this._enemyTurn());
    on('btn-skip-reward',()=>this._returnToExplore());
    window.addEventListener('keydown',e=>{
      if(e.key==='ArrowUp'   ||e.key==='w')this._move(true);
      if(e.key==='ArrowDown' ||e.key==='s')this._move(false);
      if(e.key==='ArrowLeft' ||e.key==='a')this._turn(true);
      if(e.key==='ArrowRight'||e.key==='d')this._turn(false);
      if(e.key==='Enter'||e.key===' ')     this._enemyTurn();
    });
  }
}

new Game();
</script>
