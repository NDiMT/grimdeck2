<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GrimDeck — Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a84c;--gold-dark:#7a5c1e;--px:'Press Start 2P',monospace;
  --stone:#2a2218;--stone-light:#3d3020;
  --text:#d4c5a0;--text-dim:#7a6d55;
  --hud-h:48px;--panel-h:220px;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace;color:var(--text)}
#app{display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh}

/* ── Dungeon view ──────────────────────────── */
#dungeon-view{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
#dungeon-canvas{display:block;width:100%;height:100%}

/* minimap */
#minimap{position:absolute;bottom:10px;left:10px;
  border:2px solid var(--gold-dark);box-shadow:3px 3px 0 #000;
  background:rgba(0,0,0,.75);image-rendering:pixelated;pointer-events:none}

/* weapon sprite */
#weapon-sprite{position:absolute;bottom:-8%;right:-2%;
  width:min(260px,68vw);image-rendering:pixelated;pointer-events:none;z-index:1}
/* enemy overlay */
#enemy-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding-top:10px;pointer-events:none}
#enemy-info{background:#080604;border:2px solid var(--gold-dark);box-shadow:3px 3px 0 #000;
  padding:7px 16px;text-align:center;min-width:185px}
#enemy-name{font-size:8px;color:var(--gold);letter-spacing:1px;display:block;margin-bottom:8px;text-transform:uppercase}
#enemy-hp-bar{width:100%;height:8px;background:#1a0000;border:1px solid #3a0000;overflow:hidden;margin-bottom:4px}
#enemy-hp-fill{height:100%;width:100%;background:repeating-linear-gradient(90deg,#cc2222 0,#cc2222 5px,#7a0000 5px,#7a0000 7px);transition:width .2s steps(12)}
#enemy-hp-text{font-size:6px;color:var(--text-dim)}
#enemy-intent{margin-top:6px;font-size:6px;color:#e08080;background:rgba(0,0,0,.6);border:1px solid rgba(139,26,26,.5);padding:3px 8px}

/* ── HUD ───────────────────────────────────── */
#hud{height:var(--hud-h);background:linear-gradient(180deg,#0a0805,#000);
  border-top:1px solid #2a2010;display:flex;align-items:center;
  padding:0 12px;gap:8px;flex-shrink:0}
#hud-hp{display:flex;align-items:center;gap:6px;flex:1}
#health-bar{width:72px;height:10px;background:#1a0000;border:1px solid #3a0000;box-shadow:2px 2px 0 #000;overflow:hidden}
#health-fill{height:100%;width:80%;background:repeating-linear-gradient(90deg,#cc3333 0,#cc3333 5px,#6b1212 5px,#6b1212 7px);transition:width .3s steps(9)}
#health-text{font-size:6px;color:var(--text-dim);white-space:nowrap}
#hud-center{font-size:7px;color:var(--gold);letter-spacing:1px}
#hud-right{display:flex;gap:8px;align-items:center}
.hud-icon{font-size:7px;color:var(--text-dim)}

/* ── Bottom panels ─────────────────────────── */
.bottom-panel{height:var(--panel-h);background:#000;border-top:2px solid var(--gold-dark);box-shadow:0 -3px 0 #000;flex-shrink:0}

/* dpad */
#controls{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
#dpad{display:flex;flex-direction:column;align-items:center;gap:5px}
.dpad-row{display:flex;align-items:center;gap:5px}
.dpad-center{width:52px;height:52px}
.dpad-btn{width:52px;height:52px;background:var(--stone);border:1px solid var(--stone-light);
  border-radius:8px;color:var(--text);font-size:20px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;user-select:none;touch-action:none;
  transition:background .1s,transform .08s;-webkit-user-select:none}
.dpad-btn:active{background:var(--stone-light);box-shadow:1px 1px 0 #000;transform:translate(2px,2px)}
#explore-actions{display:flex;flex-direction:column;gap:8px}
.action-btn{width:52px;height:52px;background:var(--stone);border:1px solid var(--stone-light);
  border-radius:8px;font-size:20px;cursor:pointer;touch-action:none;transition:background .1s}
.action-btn:active{background:var(--stone-light);box-shadow:1px 1px 0 #000;transform:translate(2px,2px)}

/* combat panel */
#combat-controls{display:flex;flex-direction:column;padding:7px 8px 7px;gap:5px}
#combat-stats{display:flex;gap:6px;justify-content:center;min-height:22px;align-items:center}
.stat-badge{font-size:11px;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:4px;
  color:var(--gold);letter-spacing:.5px}

/* hand — 5 visible, scroll for more */
#hand{
  display:flex;gap:6px;overflow-x:auto;padding:2px 6px 4px;flex:1;
  align-items:flex-start;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#3a2a10 transparent;
}
#hand::-webkit-scrollbar{height:3px}
#hand::-webkit-scrollbar-track{background:transparent}
#hand::-webkit-scrollbar-thumb{background:#3a2a10;border-radius:2px}

/* ── Cards ─────────────────────────────────── */
.card{
  flex-shrink:0;width:clamp(62px,21vw,80px);min-height:112px;background:#12100a;
  border:1px solid var(--gold-dark);border-radius:8px;padding:6px 5px;
  cursor:pointer;user-select:none;touch-action:pan-x;display:flex;flex-direction:column;
  gap:3px;transition:transform .15s,box-shadow .15s;-webkit-user-select:none
}
.card:active{transform:translate(2px,2px) translateY(-3px);box-shadow:1px 1px 0 #000}
.card.attack{border-color:#8b1a1a;background:linear-gradient(160deg,#1a0808,#100404)}
.card.block{border-color:#1a3a8b;background:linear-gradient(160deg,#060e1a,#040a12)}
.card.power {border-color:#5a1a7a;background:linear-gradient(160deg,#140820,#0c0614)}
.card.skill {border-color:#1a6a2a;background:linear-gradient(160deg,#08140a,#060c07)}
.card.disabled{opacity:.35;cursor:not-allowed}
.card-cost{width:18px;height:18px;font-size:8px;font-weight:bold;display:flex;align-items:center;justify-content:center;align-self:flex-start;
  background:#1a1200;border:1px solid var(--gold-dark);color:var(--gold)}
.card.attack .card-cost{background:#2a0808;border-color:#8b1a1a;color:#e08080}
.card.block  .card-cost{background:#08142a;border-color:#1a4a9b;color:#80a8e0}
.card.power  .card-cost{background:#1a0828;border-color:#7a1a9b;color:#d080f0}
.card.skill  .card-cost{background:#081408;border-color:#1a8b2a;color:#80e090}
.card-name{font-size:9.5px;color:var(--text);text-align:center;line-height:1.4}
.card-value{font-size:18px;font-weight:bold;text-align:center;line-height:1}
.card.attack .card-value{color:#e05555}
.card.block  .card-value{color:#5588e0}
.card.power  .card-value{color:#c060e0}
.card.skill  .card-value{color:#60c070}
.card-desc{font-size:8.5px;color:var(--text-dim);text-align:center;line-height:1.3;margin-top:auto}

.end-turn-btn{width:100%;height:36px;background:linear-gradient(180deg,#2a1a08,#1a1005);
  border:1px solid var(--gold-dark);border-radius:6px;color:var(--gold);font-size:13px;
  letter-spacing:1px;cursor:pointer;font-family:Georgia,serif;touch-action:none;
  transition:background .1s;flex-shrink:0}
.end-turn-btn:active{background:#1e1608;box-shadow:1px 1px 0 #000;transform:translate(2px,2px)}

/* ── Reward overlay ────────────────────────── */
#reward-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:24px}
#reward-title{font-size:22px;color:var(--gold);letter-spacing:2px}
#reward-sub{font-size:13px;color:var(--text-dim)}
#reward-cards{display:flex;gap:14px;justify-content:center}
#reward-cards .card{width:96px!important;min-height:138px!important;cursor:pointer}
#reward-cards .card-name{font-size:12px!important}
#reward-cards .card-value{font-size:26px!important}
#reward-cards .card-desc{font-size:10px!important}
#btn-skip-reward{padding:10px 32px;background:transparent;border:1px solid #444;
  border-radius:6px;color:var(--text-dim);font-size:13px;cursor:pointer;
  font-family:Georgia,serif;touch-action:none;transition:border-color .15s}
#btn-skip-reward:active{border-color:var(--gold);color:var(--gold)}

.hidden{display:none!important}
@keyframes flash-red{0%{background-color:rgba(200,0,0,.32)}100%{background-color:transparent}}
.damage-flash{animation:flash-red .35s ease-out}

/* top gradient fade */
#top-fade{position:absolute;top:0;left:0;right:0;height:55%;
  background:linear-gradient(180deg,
    rgba(0,0,0,1.0) 0%,
    rgba(0,0,0,.75) 12%,
    rgba(0,0,0,.35) 30%,
    transparent 55%);
  pointer-events:none;z-index:1}
#minimap{z-index:2}
#enemy-overlay{z-index:3}
</style>
</head>

// ── Dungeon ───────────────────────────────────────────────────────────────────

class Dungeon {
  constructor(w=22,h=22){
    this.width=w;this.height=h;this.grid=null;this.rooms=[];this.startPos=null;this.enemies=[];
    this.generate();
  }
  rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  overlaps(a,b,p=0){return!(a.x+a.w+p<=b.x||b.x+b.w+p<=a.x||a.y+a.h+p<=b.y||b.y+b.h+p<=a.y)}
  carveRoom(r){for(let z=r.y;z<r.y+r.h;z++)for(let x=r.x;x<r.x+r.w;x++)this.grid[z][x]=0}
  connectRooms(a,b){
    let cx=a.x+Math.floor(a.w/2),cz=a.y+Math.floor(a.h/2);
    const tx=b.x+Math.floor(b.w/2),tz=b.y+Math.floor(b.h/2);
    while(cx!==tx){this.grid[cz][cx]=0;cx+=cx<tx?1:-1}
    while(cz!==tz){this.grid[cz][cx]=0;cz+=cz<tz?1:-1}
  }
  generate(){
    this.grid=Array.from({length:this.height},()=>new Array(this.width).fill(1));
    this.rooms=[];
    for(let att=0;att<100&&this.rooms.length<12;att++){
      const rw=this.rand(3,7),rh=this.rand(3,6),rx=this.rand(1,this.width-rw-1),ry=this.rand(1,this.height-rh-1);
      const c={x:rx,y:ry,w:rw,h:rh};
      if(this.rooms.every(r=>!this.overlaps(r,c,1))){
        this.carveRoom(c);
        if(this.rooms.length>0)this.connectRooms(this.rooms[this.rooms.length-1],c);
        this.rooms.push(c);
      }
    }
    const f=this.rooms[0];
    this.startPos={x:f.x+Math.floor(f.w/2),z:f.y+Math.floor(f.h/2)};
    this.enemies=this.rooms.slice(1).map(room=>{
      const t=FLOOR1_ENEMIES[this.rand(0,FLOOR1_ENEMIES.length-1)];
      return{x:room.x+Math.floor(room.w/2),z:room.y+Math.floor(room.h/2),
             hp:t.hp,maxHp:t.hp,attack:t.attack,name:t.name,alive:true,
             sprite:t.sprite,glowColor:t.glowColor,size:t.size,floatY:t.floatY||0};
    });
  }
  isWall(x,z){return x<0||z<0||x>=this.width||z>=this.height||this.grid[z][x]===1}
  getEnemyAt(x,z){return this.enemies.find(e=>e.alive&&e.x===x&&e.z===z)}
}

// ── Minimap ───────────────────────────────────────────────────────────────────

class Minimap {
  constructor(canvas, dungeon) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cs = 5;
    this.grid = dungeon.grid;
    canvas.width  = dungeon.width  * this.cs;
    canvas.height = dungeon.height * this.cs;
    const display = Math.min(110, dungeon.width * this.cs);
    canvas.style.width  = display + 'px';
    canvas.style.height = display + 'px';
  }

  update(player, enemies, visited) {
    const {ctx, cs, grid} = this;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    for (let z = 0; z < grid.length; z++) {
      for (let x = 0; x < grid[z].length; x++) {
        if (!visited.has(`${x},${z}`)) continue;
        ctx.fillStyle = grid[z][x] === 1 ? '#1a1510' : '#5a4838';
        ctx.fillRect(x * cs, z * cs, cs, cs);
      }
    }

    enemies.forEach(e => {
      if (e.alive || !visited.has(`${e.x},${e.z}`)) return;
      ctx.fillStyle = 'rgba(80,60,50,.6)';
      ctx.fillRect(e.x * cs + 1, e.z * cs + 1, cs - 2, cs - 2);
    });

    enemies.forEach(e => {
      if (!e.alive || !visited.has(`${e.x},${e.z}`)) return;
      ctx.fillStyle = '#cc2200';
      ctx.beginPath();
      ctx.arc((e.x + .5) * cs, (e.z + .5) * cs, cs * .42, 0, Math.PI * 2);
      ctx.fill();
    });

    const px = (player.x + .5) * cs;
    const pz = (player.z + .5) * cs;
    ctx.fillStyle = '#c9a84c';
    ctx.beginPath();
    ctx.arc(px, pz, cs * .55, 0, Math.PI * 2);
    ctx.fill();

    const angle = [-Math.PI/2, 0, Math.PI/2, Math.PI][player.dir];
    ctx.strokeStyle = '#ffe080';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(px, pz);
    ctx.lineTo(px + Math.cos(angle) * cs * 1.4, pz + Math.sin(angle) * cs * 1.4);
    ctx.stroke();
  }

// ── Renderer ──────────────────────────────────────────────────────────────────

const TILE=2,WALL_H=2.6,EYE_Y=1.15;
const DIR_ANGLE=[0,-Math.PI/2,Math.PI,Math.PI/2];

class Renderer {
  constructor(canvas){
    this.scene=new THREE.Scene();
    this.scene.background=new THREE.Color(0x000000);
    this.scene.fog=new THREE.Fog(0x000000,4,22);
    this.camera=new THREE.PerspectiveCamera(72,1,0.05,60);
    this.renderer=new THREE.WebGLRenderer({canvas,antialias:true});
    this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    this._setupLights();
    this.dungeonGroup=new THREE.Group();
    this.enemyGroup=new THREE.Group();
    this.scene.add(this.dungeonGroup,this.enemyGroup);
    this.torchTime=0;
  }
  _setupLights(){
    this.scene.add(new THREE.AmbientLight(0x9a8858,2.2));
    this.torch=new THREE.PointLight(0xffbb66,9,20,2);
    this.camera.add(this.torch);
    this.scene.add(this.camera);
  }
  _loadTex(src){
    const t=new THREE.TextureLoader().load(src);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.colorSpace=THREE.SRGBColorSpace;
    t.magFilter=THREE.LinearFilter;
    t.minFilter=THREE.LinearMipmapLinearFilter;
    t.anisotropy=this.renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  buildDungeon(grid){
    this.dungeonGroup.clear();
    const wMats=[
      new THREE.MeshLambertMaterial({map:this._loadTex(TEX.wall)}),
      new THREE.MeshLambertMaterial({map:this._loadTex(TEX.wall_chain)}),
      new THREE.MeshLambertMaterial({map:this._loadTex(TEX.wall_torch)}),
      new THREE.MeshLambertMaterial({map:this._loadTex(TEX.wall_skull)}),
    ];
    const fMats=[new THREE.MeshLambertMaterial({map:this._loadTex(TEX.floor)}),new THREE.MeshLambertMaterial({map:this._loadTex(TEX.floor2)}),new THREE.MeshLambertMaterial({map:this._loadTex(TEX.floor3)}),new THREE.MeshLambertMaterial({map:this._loadTex(TEX.floor4)})];
    
    
    const wallGeo=new THREE.PlaneGeometry(TILE,TILE);
    const pGeo=new THREE.PlaneGeometry(TILE,TILE);
    const FACES=[[0,-1,Math.PI,0,-TILE/2],[1,0,Math.PI/2,TILE/2,0],[0,1,0,0,TILE/2],[-1,0,-Math.PI/2,-TILE/2,0]];
    for(let z=0;z<grid.length;z++){
      for(let x=0;x<grid[z].length;x++){
        const wx=x*TILE,wz=z*TILE;
        if(grid[z][x]===1){
          FACES.forEach(([dx,dz,rotY,ox,oz])=>{
            const nx=x+dx,nz=z+dz;
            if(!grid[nz]||grid[nz][nx]!==0)return;
            const r=Math.random();
            const mat=r<0.60?wMats[0]:r<0.80?wMats[1]:r<0.92?wMats[2]:wMats[3];
            const face=new THREE.Mesh(wallGeo,mat);
            face.position.set(wx+ox,TILE/2,wz+oz);face.rotation.y=rotY;
            this.dungeonGroup.add(face);
          });
        } else {
          const fr=Math.random();const fMat=fr<0.65?fMats[0]:fr<0.80?fMats[1]:fr<0.90?fMats[2]:fMats[3];const fl=new THREE.Mesh(pGeo,fMat);fl.rotation.x=-Math.PI/2;fl.position.set(wx,0,wz);this.dungeonGroup.add(fl);

        }
      }
    }
  }
  buildEnemyMarkers(enemies){
    this.enemyGroup.clear();
    const loader=new THREE.TextureLoader();
    enemies.forEach(enemy=>{
      const group=new THREE.Group();
      const tex=loader.load(SPRITES[enemy.sprite]);
      tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;
      const sz=TILE*(enemy.size||1.0);
      const fy=enemy.floatY||0;
      const cy=sz/2+fy;
      const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,alphaTest:0.5,depthWrite:false,color:0x110a04}));
      sprite.scale.set(sz,sz,1);sprite.position.y=cy;group.add(sprite);
      const light=new THREE.PointLight(0xffbb66,1.5,4,2);
      light.position.y=cy;group.add(light);
      group.position.set(enemy.x*TILE,0,enemy.z*TILE);
      group.userData.enemy=enemy;group.userData.sprite=sprite;
      this.enemyGroup.add(group);
    });
  }
  updateEnemyMarkers(){this.enemyGroup.children.forEach(g=>g.visible=g.userData.enemy.alive)}
  setPlayer(x,z,dir){this.camera.position.set(x*TILE,EYE_Y,z*TILE);this.camera.rotation.set(0,DIR_ANGLE[dir],0)}
  resize(w,h){this.renderer.setSize(w,h);this.camera.aspect=w/h;this.camera.updateProjectionMatrix()}
  render(dt){
    this.torchTime+=dt;
    this.torch.intensity=7.5+Math.sin(this.torchTime*6.3)*.5+Math.sin(this.torchTime*11.7)*.25;
    const cam=this.camera.position;
    this.enemyGroup.children.forEach(group=>{
      if(!group.visible)return;
      const dist=cam.distanceTo(group.position);
      const t=Math.max(0,Math.min(1,(10-dist)/7));
      const r=0x11+Math.round((0x88-0x11)*t);
      const g=0x0a+Math.round((0x66-0x0a)*t);
      const b=0x04+Math.round((0x44-0x04)*t);
      group.userData.sprite.material.color.setRGB(r/255,g/255,b/255);
    });
    this.renderer.render(this.scene,this.camera);
  }
}

// ── Player ────────────────────────────────────────────────────────────────────

class Player {
  constructor(x,z){
    this.x=x;this.z=z;this.dir=0;
    this.hp=80;this.maxHp=100;
    this.block=0;this.strength=0;this.dexterity=0;
    this.deck=CARDS.filter(c=>c.starter).map(c=>({...c}));
    this.hand=[];this.energy=3;this.maxEnergy=3;
  }
  forwardDelta(){return{dx:[0,1,0,-1][this.dir],dz:[-1,0,1,0][this.dir]}}
  turnLeft(){this.dir=(this.dir+3)%4}
  turnRight(){this.dir=(this.dir+1)%4}
  moveTo(x,z){this.x=x;this.z=z}
  startCombat(){this.strength=0;this.dexterity=0;this.drawHand()}
  drawHand(n=7){
    this.hand=[...this.deck].sort(()=>Math.random()-.5).slice(0,n);
    this.energy=this.maxEnergy;
    this.block=0;
  }
}

// ── Game ──────────────────────────────────────────────────────────────────────

class Game {
  constructor(){
    this.canvas=document.getElementById('dungeon-canvas');
    this.minimapCanvas=document.getElementById('minimap');
    this.state='explore';this.currentEnemy=null;this.lastTime=0;this.floor=1;
    this._newFloor();
    this._setupInput();
    this._resize();
    requestAnimationFrame(()=>this._resize());
    window.addEventListener('resize',()=>this._resize());
    requestAnimationFrame(t=>this._loop(t));
  }

  _newFloor(){
    this.dungeon=new Dungeon();
    const{x,z}=this.dungeon.startPos;
    if(!this.renderer)this.renderer=new Renderer(this.canvas);
    if(!this.player){this.player=new Player(x,z);}
    else{this.player.moveTo(x,z);this.player.dir=0;}
    this.renderer.buildDungeon(this.dungeon.grid);
    this.visited=new Set();
    this._markVisible(x,z);
    this.renderer.buildEnemyMarkers(this.dungeon.enemies);
    this.renderer.setPlayer(this.player.x,this.player.z,this.player.dir);
    this.minimap=new Minimap(this.minimapCanvas,this.dungeon);
    this.minimap.update(this.player,this.dungeon.enemies,this.visited);
    document.getElementById('floor-num').textContent=this.floor;
    this._updateHUD();
  }

  _resize(){
    const v=document.getElementById('dungeon-view');
    this.renderer.resize(v.clientWidth,v.clientHeight);
  }

  _loop(time){
    const dt=Math.min((time-this.lastTime)/1000,.1);
    this.lastTime=time;
    this.renderer.render(dt);
    requestAnimationFrame(t=>this._loop(t));
  }

  // ── Exploration ───────────────────────

  _move(fwd){
    if(this.state!=='explore')return;
    const{dx,dz}=this.player.forwardDelta();
    const nx=this.player.x+(fwd?dx:-dx),nz=this.player.z+(fwd?dz:-dz);
    if(this.dungeon.isWall(nx,nz))return;
    const enemy=this.dungeon.getEnemyAt(nx,nz);
    if(enemy&&fwd){this._markVisible(nx,nz);this._startCombat(enemy);return;}
    this.player.moveTo(nx,nz);
    this._markVisible(nx,nz);
    this.renderer.setPlayer(this.player.x,this.player.z,this.player.dir);
    this.minimap.update(this.player,this.dungeon.enemies,this.visited);
  }

  _turn(left){
    if(this.state!=='explore')return;
    left?this.player.turnLeft():this.player.turnRight();
    this.renderer.setPlayer(this.player.x,this.player.z,this.player.dir);
    this.minimap.update(this.player,this.dungeon.enemies,this.visited);
  }

  _markVisible(x,z){
    const g=this.dungeon.grid,v=this.visited;
    const reveal=(cx,cz)=>{
      v.add(`${cx},${cz}`);
      for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]])
        if(g[cz+dz]?.[cx+dx]===1)v.add(`${cx+dx},${cz+dz}`);
    };
    reveal(x,z);
    for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){
      let nx=x+dx,nz=z+dz;
      while(g[nz]?.[nx]===0){reveal(nx,nz);nx+=dx;nz+=dz;}
      if(g[nz]?.[nx]===1)v.add(`${nx},${nz}`);
    }
  }

  // ── Combat ────────────────────────────

  _startCombat(enemy){
    this.state='combat';this.currentEnemy=enemy;
    this.player.startCombat();
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('weapon-sprite').classList.add('hidden');
    document.getElementById('combat-controls').classList.remove('hidden');
    document.getElementById('enemy-overlay').classList.remove('hidden');
    document.getElementById('enemy-name').textContent=enemy.name;
    document.getElementById('enemy-intent-val').textContent=enemy.attack;
    this._updateCombatUI();this._updateHUD();
  }

  playCard(i){
    if(this.state!=='combat')return;
    const card=this.player.hand[i];
    if(!card||this.player.energy<card.cost)return;
    const p=this.player,e=this.currentEnemy;
    p.energy-=card.cost;
    p.hand.splice(i,1);

    switch(card.effect){
      case 'damage':{
        const dmg=Math.max(0,card.value+p.strength);
        for(let h=0;h<(card.hits||1);h++)e.hp=Math.max(0,e.hp-dmg);
        this._flash();break;
      }
      case 'block':    p.block+=card.value+p.dexterity;break;
      case 'entrench': p.block*=2;break;
      case 'bodyslam': e.hp=Math.max(0,e.hp-p.block);this._flash();break;
      case 'iron_wave':
        p.block+=card.value+p.dexterity;
        e.hp=Math.max(0,e.hp-card.value-p.strength);
        this._flash();break;
      case 'whirlwind':{
        const spent=p.energy;e.hp=Math.max(0,e.hp-card.value*spent);p.energy=0;this._flash();break;
      }
      case 'strength':      p.strength+=card.value;break;
      case 'dexterity':     p.dexterity+=card.value;break;
      case 'bloodletting':  p.hp=Math.max(1,p.hp-3);p.energy+=2;break;
      case 'draw':          p.hand.push(...[...p.deck].sort(()=>Math.random()-.5).slice(0,card.value));break;
      case 'energy':        p.energy+=card.value;break;
      case 'second_wind':{
        const na=p.hand.filter(c=>c.type!=='attack');
        p.block+=na.length*card.value;
        p.hand=p.hand.filter(c=>c.type==='attack');break;
      }
      case 'offering':
        p.hp=Math.max(1,p.hp-6);p.energy+=2;
        p.hand.push(...[...p.deck].sort(()=>Math.random()-.5).slice(0,3));break;
    }

    if(card.draw)p.hand.push(...[...p.deck].sort(()=>Math.random()-.5).slice(0,card.draw));

    if(e.hp<=0){setTimeout(()=>this._victory(),350);this._updateCombatUI();this._updateHUD();return;}
    this._updateCombatUI();this._updateHUD();
  }

  _enemyTurn(){
    if(this.state!=='combat')return;
    const dmg=this.currentEnemy.attack;
    const abs=Math.min(this.player.block,dmg);
    this.player.block=Math.max(0,this.player.block-dmg);
    this.player.hp=Math.max(0,this.player.hp-(dmg-abs));
    this._updateHUD();this.player.drawHand();this._updateCombatUI();
  }

  // ── Victory / Reward ──────────────────

  _victory(){
    this.currentEnemy.alive=false;
    this.renderer.updateEnemyMarkers();
    this.minimap.update(this.player,this.dungeon.enemies,this.visited);
    document.getElementById('combat-controls').classList.add('hidden');
    document.getElementById('enemy-overlay').classList.add('hidden');
    this._showReward();
  }

  _showReward(){
    const picks=[...CARDS.filter(c=>!c.starter)].sort(()=>Math.random()-.5).slice(0,3);
    const el=document.getElementById('reward-cards');
    el.innerHTML='';
    picks.forEach(card=>{
      const div=document.createElement('div');
      div.className=`card ${card.type}`;
      div.innerHTML=`<div class="card-cost">${card.cost}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">${card.value||'✦'}</div>
        <div class="card-desc">${card.desc}${card.exhaust?' ·Exhaust':''}</div>`;
      let rx,ry;
      div.addEventListener('pointerdown',ev=>{rx=ev.clientX;ry=ev.clientY;});
      div.addEventListener('pointerup',ev=>{if(Math.hypot(ev.clientX-rx,ev.clientY-ry)<12){ev.preventDefault();this._pickReward(card);}});
      el.appendChild(div);
    });
    document.getElementById('reward-overlay').classList.remove('hidden');
  }

  _pickReward(card){
    this.player.deck.push({...card,id:card.id+'_'+Date.now()});
    this._returnToExplore();
  }

  _returnToExplore(){
    this.state='explore';this.currentEnemy=null;
    document.getElementById('reward-overlay').classList.add('hidden');
    document.getElementById('controls').classList.remove('hidden');
    document.getElementById('weapon-sprite').classList.remove('hidden');
    this._updateHUD();
  }

  // ── UI ────────────────────────────────

  _updateHUD(){
    const p=this.player;
    document.getElementById('health-fill').style.width=(p.hp/p.maxHp*100)+'%';
    document.getElementById('health-text').textContent=`${p.hp}/${p.maxHp}`;
    document.getElementById('block-text').textContent=`🛡 ${p.block}`;
    document.getElementById('energy-text').textContent=`⚡ ${p.energy}`;
  }

  _updateCombatUI(){
    const p=this.player,e=this.currentEnemy;if(!e)return;
    document.getElementById('enemy-hp-fill').style.width=Math.max(0,e.hp/e.maxHp*100)+'%';
    document.getElementById('enemy-hp-text').textContent=`${e.hp}/${e.maxHp}`;
    document.getElementById('energy-text').textContent=`⚡ ${p.energy}`;
    document.getElementById('block-text').textContent=`🛡 ${p.block}`;
    const stats=document.getElementById('combat-stats');
    stats.innerHTML='';
    if(p.strength>0)stats.innerHTML+=`<span class="stat-badge">⚔ STR +${p.strength}</span>`;
    if(p.dexterity>0)stats.innerHTML+=`<span class="stat-badge">🛡 DEX +${p.dexterity}</span>`;
    const hand=document.getElementById('hand');
    hand.innerHTML='';
    p.hand.forEach((card,i)=>{
      const el=document.createElement('div');
      el.className=`card ${card.type}${p.energy<card.cost?' disabled':''}`;
      el.innerHTML=`<div class="card-cost">${card.cost}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">${card.value||'✦'}</div>
        <div class="card-desc">${card.desc}</div>`;
      let tx,ty;
      el.addEventListener('pointerdown',ev=>{tx=ev.clientX;ty=ev.clientY;});
      el.addEventListener('pointerup',ev=>{if(Math.hypot(ev.clientX-tx,ev.clientY-ty)<12){ev.preventDefault();this.playCard(i);}});
      hand.appendChild(el);
    });
  }

  _flash(){
    const v=document.getElementById('dungeon-view');
    v.classList.remove('damage-flash');void v.offsetWidth;v.classList.add('damage-flash');
  }

  // ── Input ─────────────────────────────

  _setupInput(){
    const on=(id,fn)=>{const el=document.getElementById(id);if(!el)return;el.addEventListener('pointerdown',e=>{e.preventDefault();fn();});};
    on('btn-forward',    ()=>this._move(true));
    on('btn-back',       ()=>this._move(false));
    on('btn-left',       ()=>this._turn(true));
    on('btn-right',      ()=>this._turn(false));
    on('btn-end-turn',   ()=>this._enemyTurn());
    on('btn-skip-reward',()=>this._returnToExplore());
    on('btn-toggle-map', ()=>this.minimapCanvas.classList.toggle('hidden'));
    window.addEventListener('keydown',e=>{
      if(e.key==='ArrowUp'   ||e.key==='w')this._move(true);
      if(e.key==='ArrowDown' ||e.key==='s')this._move(false);
      if(e.key==='ArrowLeft' ||e.key==='a')this._turn(true);
      if(e.key==='ArrowRight'||e.key==='d')this._turn(false);
      if(e.key==='Enter'||e.key===' ')     this._enemyTurn();
      if(e.key==='m')this.minimapCanvas.classList.toggle('hidden');
    });
  }
}

new Game();
</script>
